<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniConnect - Resident & Staff Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div class="glass-card" style="max-width: 440px; width: 100%; text-align: center; padding: 2.5rem 2rem;">
    <div class="omni-logo-icon" style="margin: 0 auto 1rem; width: 52px; height: 52px; font-size: 1.6rem;">
      🎙️
    </div>
    
    <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.35rem;">OmniConnect</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">
      Voice-Driven Virtual Community Portal
    </p>

    <form action="/login" method="POST">
      <div class="form-group">
        <label class="form-label">Email / Resident ID</label>
        <input type="email" name="email" class="form-control" placeholder="resident@omnicennect.io" value="resident@omnicennect.io" required />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" value="password123" required />
      </div>

      <div class="form-group">
        <label class="form-label">Login Role</label>
        <select class="form-control">
          <option value="resident">🏢 Resident (Emerald Heights)</option>
          <option value="technician">🔧 Maintenance Technician</option>
          <option value="manager">👔 Community Manager</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        <span>🚀</span> Sign In to OmniConnect
      </button>
    </form>

    <div style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      New resident? <a href="/register" style="color: var(--primary-light); font-weight: 600;">Register flat</a>
    </div>
  </div>

  <script src="/static/js/omni-voice.js"></script>
</body>
</html>
