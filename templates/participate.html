<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Participation</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #00796b 0%, #004d40 100%);
      --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      --bg-light: #e0f7fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      padding-bottom: 3rem;
    }

    .header {
      background: var(--primary-gradient);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      border-radius: 0 0 30px 30px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .event-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .event-card {
      background: white;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
      border-top: 5px solid #00796b;
      position: relative;
    }

    .event-card:hover {
      transform: translateY(-8px);
    }

    .event-card h3 {
      color: #004d40;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .event-card .meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    .event-card p {
      flex-grow: 1;
      font-size: 0.95rem;
      color: #444;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .register-btn {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      width: 100%;
    }

    .register-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }

    .register-btn:disabled {
      background: #cfd8dc;
      color: #78909c;
      cursor: not-allowed;
      transform: none;
    }

    .badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #e0f2f1;
      color: #00796b;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .no-events {
      text-align: center;
      padding: 4rem;
      background: white;
      border-radius: 25px;
      color: #666;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/trackdetails'">← Back</button>
    <h1>Community Events</h1>
  </div>

  <div class="container">
    <div class="event-list" id="eventList">
      <!-- Events will be injected here -->
    </div>
  </div>

  <script>
    const participant_email = "resident@shebuilds.com";

    async function loadEvents() {
      try {
        const res = await fetch('/get_events');
        const events = await res.json();
        const container = document.getElementById("eventList");
        container.innerHTML = '';

        if (!events || events.length === 0) {
          container.innerHTML = '<div class="no-events"><p>No upcoming events at the moment. Stay tuned!</p></div>';
          return;
        }

        events.forEach(event => {
          const card = document.createElement('div');
          card.className = 'event-card';
          card.innerHTML = `
            <div class="badge">Resident View</div>
            <h3>${event.title}</h3>
            <div class="meta">
                <div>📅 ${event.start_date}</div>
                <div>📍 ${event.location || 'Community Center'}</div>
            </div>
            <p>${event.description || 'Join us for this exciting community gathering!'}</p>
            <button class="register-btn">Register Now</button>
          `;

          const btn = card.querySelector('.register-btn');
          btn.addEventListener('click', async () => {
            const payload = {
              title: event.title,
              email: participant_email,
              registered_on: new Date().toISOString()
            };

            const response = await fetch("/register_event", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              btn.disabled = true;
              btn.innerText = "✅ Registered";
              btn.style.background = "#4caf50";
            } else {
              alert("Registration failed. Please try again later.");
            }
          });

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading events:", err);
        document.getElementById("eventList").innerHTML = '<div class="no-events"><p>Unable to load events. Please try again.</p></div>';
      }
    }

    loadEvents();
  </script>
</body>

</html>
