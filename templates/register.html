<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniConnect - Register Resident Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">

  <div class="glass-card" style="max-width: 500px; width: 100%; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="omni-logo-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.4rem;">
        🎙️
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">Register Flat / Profile</h2>
      <p style="color: var(--text-secondary); font-size: 0.85rem;">Join Emerald Heights Smart Voice Community</p>
    </div>

    <form action="/register" method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Aarav Sharma" required />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="name@domain.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" placeholder="+91 98401 22345" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Account Role</label>
          <select name="userType" class="form-control">
            <option value="resident">Resident</option>
            <option value="technician">Technician</option>
            <option value="manager">Manager</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        <span>✨</span> Complete Registration
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account? <a href="/login" style="color: var(--primary-light); font-weight: 600;">Sign in</a>
    </div>
  </div>

</body>
</html>
