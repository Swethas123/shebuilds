{% extends "base.html" %}

{% block title %}OmniConnect - Create Community Event{% endblock %}

{% block content %}
<div class="page-hero">
  <div class="page-hero-info">
    <h1><span>➕</span> Create Community Event</h1>
    <p>Organize social gatherings, workshops, fitness sessions, or cultural festivals.</p>
  </div>
  <div>
    <a href="/events" class="btn btn-secondary">
      ← Back to Events Hub
    </a>
  </div>
</div>

<div class="glass-card" style="max-width: 680px; margin: 0 auto;">
  <form action="/create-event" method="POST">
    <div class="form-group">
      <label class="form-label">Event Name / Title</label>
      <input type="text" name="name" class="form-control" placeholder="e.g. Table Tennis Tournament & High Tea" required />
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select name="category" class="form-control">
          <option value="Social & Cultural">Social & Cultural</option>
          <option value="Health & Wellness">Health & Wellness</option>
          <option value="Sports & Fitness">Sports & Fitness</option>
          <option value="Kids & Learning">Kids & Learning</option>
          <option value="Eco & Green Society">Eco & Green Society</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Location (Infrastructure)</label>
        <select name="location" class="form-control" required>
          <option value="Clubhouse Main Hall">Clubhouse Main Hall</option>
          <option value="Terrace Lounge & Sky Garden">Terrace Lounge & Sky Garden</option>
          <option value="Central Garden Gazebo">Central Garden Gazebo</option>
          <option value="Swimming Pool Deck">Swimming Pool Deck</option>
          <option value="Sports Arena / Badminton Court">Sports Arena / Badminton Court</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="text" name="date" class="form-control" placeholder="e.g. Saturday, Sep 12, 2026" required />
      </div>

      <div class="form-group">
        <label class="form-label">Time</label>
        <input type="text" name="time" class="form-control" placeholder="e.g. 06:00 PM - 09:00 PM" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Description & Agenda</label>
      <textarea name="description" rows="3" class="form-control" placeholder="Provide details, refreshments, registration guidelines..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Custom Voice Announcement Script (Optional)</label>
      <input type="text" name="announcement" class="form-control" placeholder="e.g. Get ready for our society Table Tennis tournament this Saturday at 6 PM!" />
    </div>

    <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
      <a href="/events" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">
        <span>🚀</span> Publish Event & Notify Residents
      </button>
    </div>
  </form>
</div>
{% endblock %}
